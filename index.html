<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#05060f" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="{{SITE_URL}}/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{SITE_URL}}/" />
    <meta property="og:image" content="{{SITE_URL}}/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A neon cyberpunk megacity at night with a glowing jellyfish hologram drifting over the avenue." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{SITE_URL}}/og.png" />

    <script type="application/ld+json">{{JSON_LD}}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    {{NOSCRIPT}}
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
